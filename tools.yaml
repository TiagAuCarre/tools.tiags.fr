# =====================================================================
#  TOOLS.YAML — édite ce fichier pour ajouter/modifier tes outils
#  Aucune connaissance du code requise, juste respecter l'indentation.
# =====================================================================

title: "Ma Tool Box"
description: "Tous mes outils, sites et logiciels préférés, au même endroit."

sections:
#Types D'Icones :
#globe — un globe (sites web)
#download — flèche de téléchargement
#terminal — invite de commande
#windows — les 4 carrés (logo Windows)
#wrench — clé à molette (outils/réglages)
#code — chevrons < > (dev)
#gamepad — manette de jeu
#shield — bouclier (sécurité)
#folder — dossier (par défaut si t'indiques rien)
#network — schéma réseau
#link — chaîne de lien (utilisé par défaut sur les outils)

  # ------------------------------------------------------------------
  # Une "section" = un gros bloc repliable. icon est optionnel.
  # Icônes disponibles: globe, download, terminal, windows, wrench,
  # code, gamepad, shield, folder, network, link
  # ------------------------------------------------------------------
  - title: "My OWN Tools"
    icon: folder
    tools:
      - title: "QRCoddy"
        url: "https://tools.tiags.fr/qrcoddy"
        desc: "Tiago Meira - CopyRight"
  - title: "Sites Web"
    icon: globe
    tools:
      - title: "Mon site CV"
        url: "https://tiags.fr"
        desc: "Y'a pas vrm de desc..."

    # Une "subsection" = sous-groupe repliable À L'INTÉRIEUR d'une section
    subsections:
      - title: "Outils réseau"
        tools:

  - title: "Software"
    icon: windows
    tools:
      - title: "Everything"
        url: "https://www.voidtools.com/downloads/"
        desc: "Recherche de fichiers instantanée"
        tag: "Indispensable"

      - title: "Rufus"
        url: "https://github.com/pbatard/rufus/releases/download/v4.15/rufus-4.15.exe"
        desc: "Créer une clé USB bootable"
        icon: download
      - title: "TeraCopy 3.17"
        url: "https://tools.tiags.fr/files/soft/teracopy-3-17.exe"
      - title: "SpaceSniffer"
        url: "https://tools.tiags.fr/files/soft/SpaceSniffer.exe"
      - title: "Aomei Partition Assistant"
        url: "https://raw.githubusercontent.com/tiagaucarre/tools.tiags.fr/big-files/big-files/AOMEI-partition-asssistant.exe"
      - title: "PowerToys"
        url: "https://learn.microsoft.com/fr-fr/windows/powertoys/"

  - title: "Commandes utiles"
    icon: terminal
    tools:
      # type: code -> affiche un bloc de code avec bouton copier
      - title: "Activer Windows/Office"
        type: code
        desc: "À lancer en powershell admin"
        code: |
          irm https://get.activated.win | iex

      - title: "Vider le cache DNS"
        type: code
        code: |
          ipconfig /flushdns

      - title: "Voir les ports ouverts"
        type: code
        code: |
          netstat -ano | findstr LISTENING
  - title: "Utils Files"
    icon: download
    tools:
      - title: "Winrar Key"
        url: "https://tools.tiags.fr/files/rarreg.key"
        desc: "À copier à la racine du logiciel."
      - title: "PS2EXE"
        url: "https://tools.tiags.fr/files/html/ps1-compiler-command.html"
        desc: "Compile .PS1 File to .EXE file."
      - title: "Enable RDP"
        url: "https://tools.tiags.fr/files/html/enable-rdp.html" 
      - title: "Block Spotify Pause on Discord"
        url: "https://tools.tiags.fr/files/html/block-spotify-request.html" 

