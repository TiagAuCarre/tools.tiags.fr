<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root {
  --bg: #08090c;
  --glass: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.10);
  --accent: #22c55e;
  --accent-glow: #6ee89a;
  --accent2: #eab308;
  --text: #f2f2f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'League Spartan', sans-serif; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
.container { max-width: 1000px; margin: auto; padding: 0 20px; position: relative; z-index: 2; }

/* ===== FOND ===== */
.orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
.orb-1 { width: 550px; height: 550px; background: radial-gradient(circle, rgba(34,197,94,0.16), transparent 70%); top: -180px; left: -160px; animation: orbFloat 16s ease-in-out infinite; }
.orb-2 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(234,179,8,0.12), transparent 70%); bottom: -140px; right: -120px; animation: orbFloat2 19s ease-in-out infinite; }
@keyframes orbFloat  { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-25px)} }
@keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,20px)} }
@keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

/* ===== GLASS ===== */
.glass { background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border); position: relative; overflow: hidden; }
.glass-glow::before {
  content: ""; position: absolute; width: 320px; height: 320px; border-radius: 50%;
  background: radial-gradient(circle, rgba(34,197,94,0.22), transparent 65%); filter: blur(20px);
  pointer-events: none; transform: translate(-50%,-50%);
  left: var(--gx,-999px); top: var(--gy,-999px); z-index: 0; opacity: 0; transition: opacity 0.4s;
}
.glass-glow:hover::before { opacity: 1; }
.glass-glow > * { position: relative; z-index: 1; }

/* ===== TOP BAR (pas de vraie navbar, juste titre + recherche) ===== */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 999; padding: 18px 20px 0; }
.header-pill {
  max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; gap: 16px;
  background: rgba(8,9,12,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px; padding: 10px 12px 10px 22px;
}
.logo { font-weight: 900; letter-spacing: 1px; font-size: 1.05rem; white-space: nowrap; }
.logo span { color: var(--accent-glow); }
.search-wrap { position: relative; flex: 1; max-width: 420px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; opacity: 0.5; pointer-events: none; }
#search {
  width: 100%; padding: 9px 14px 9px 38px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text); font-size: 0.88rem; font-weight: 600; outline: none;
  transition: 0.2s;
}
#search:focus { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.08); }
#search::placeholder { color: rgba(255,255,255,0.35); }

/* ===== HERO ===== */
.hero { padding: 140px 0 30px; animation: fadeInUp 0.7s ease both; }
.hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; margin-bottom: 6px; }
.hero p { opacity: 0.6; font-size: 0.95rem; }

/* ===== SECTIONS (accordéon) ===== */
.sections { padding: 20px 0 70px; display: flex; flex-direction: column; gap: 16px; }
.section-block { border-radius: 22px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 24px; cursor: pointer; user-select: none;
}
.section-head-left { display: flex; align-items: center; gap: 14px; }
.section-head-left svg.section-icon { width: 20px; height: 20px; color: var(--accent-glow); flex-shrink: 0; }
.section-head h2 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
.section-count { font-size: 0.75rem; font-weight: 700; opacity: 0.45; }
.chevron { width: 18px; height: 18px; transition: transform 0.3s ease; opacity: 0.6; flex-shrink: 0; }
.section-block.open .chevron { transform: rotate(180deg); }
.section-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
.section-block.open .section-body { }
.section-body-inner { padding: 0 24px 24px; }

/* ===== SOUS-SECTIONS ===== */
.subsection { margin-top: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
.subsection-head {
  display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; cursor: pointer;
  background: rgba(255,255,255,0.03); user-select: none;
}
.subsection-head h3 { font-size: 0.9rem; font-weight: 800; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.4px; }
.subsection-head .chevron { width: 15px; height: 15px; }
.subsection-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
.subsection.open .chevron { transform: rotate(180deg); }
.subsection-body-inner { padding: 16px 18px 6px; }

/* ===== GRILLE OUTILS ===== */
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
.section-body-inner > .tools-grid { margin-top: 4px; }
.tool-card {
  display: block; padding: 16px 18px; border-radius: 16px; transition: 0.25s;
}
.tool-card:hover { transform: translateY(-2px); border-color: rgba(34,197,94,0.4); }
.tool-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.tool-head h4 { font-size: 0.95rem; font-weight: 800; }
.tool-head svg.link-icon { width: 14px; height: 14px; opacity: 0.4; flex-shrink: 0; }
.tool-desc { font-size: 0.82rem; opacity: 0.55; line-height: 1.5; }
.tool-tag {
  display: inline-block; margin-top: 10px; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.5px;
  color: var(--accent2); background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.25);
  padding: 3px 10px; border-radius: 999px; text-transform: uppercase;
}

/* ===== BLOC CODE ===== */
.tool-card.code-card { cursor: default; }
.tool-card.code-card:hover { transform: none; }
.code-box {
  position: relative; margin-top: 10px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 12px 14px; overflow-x: auto;
}
.code-box pre { font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--accent2); white-space: pre-wrap; word-break: break-word; }
.copy-btn {
  position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; padding: 5px 6px; cursor: pointer; color: var(--text); opacity: 0.6; transition: 0.2s;
}
.copy-btn:hover { opacity: 1; background: rgba(34,197,94,0.2); }
.copy-btn svg { width: 13px; height: 13px; display: block; }

/* ===== ETAT VIDE ===== */
.empty-state { text-align: center; padding: 60px 20px; opacity: 0.5; display: none; }
.empty-state.show { display: block; }

/* ===== HIGHLIGHT RECHERCHE ===== */
.hidden-by-search { display: none !important; }
mark { background: rgba(34,197,94,0.35); color: inherit; border-radius: 3px; padding: 0 2px; }

footer { text-align: center; padding: 24px 0 40px; opacity: 0.4; font-size: 0.82rem; }

@media (max-width: 600px) {
  .logo { display: none; }
  .header-pill { padding: 8px 8px 8px 16px; }
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header>
  <div class="header-pill glass">
    <div class="logo">GAME<span>BOX</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Rechercher un jeu...">
    </div>
  </div>
</header>

<div class="container">

  <div class="hero">
    <h1 id="page-title">Ma Game Box</h1>
    <p id="page-desc">Tous mes jeux, launchers et sites gaming préférés, au même endroit.</p>
  </div>

  <div class="sections" id="sections"></div>

  <div class="empty-state" id="empty-state">Aucun jeu ne correspond à ta recherche.</div>

</div>

<footer>© Tiago Meira — Tous droits réservés. · Édite <code>games.yaml</code> pour ajouter tes propres jeux.</footer>

<script>
const ICONS = {
  default: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  windows: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  gamepad: '<line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="6"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  network: '<rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M12 12H5v4M12 12h7v4"/>',
  link: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
};
function iconSvg(name, cls) {
  return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.default}</svg>`;
}
function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTool(tool) {
  if (tool.type === 'code') {
    const codeId = 'code_' + Math.random().toString(36).slice(2, 9);
    return `
    <div class="tool-card code-card glass">
      <div class="tool-head">
        <h4>${escapeHtml(tool.title)}</h4>
        ${iconSvg('terminal', 'link-icon')}
      </div>
      ${tool.desc ? `<p class="tool-desc">${escapeHtml(tool.desc)}</p>` : ''}
      <div class="code-box">
        <button class="copy-btn" onclick="copyCode('${codeId}', this)">${iconSvg('link')}</button>
        <pre id="${codeId}">${escapeHtml(tool.code)}</pre>
      </div>
    </div>`;
  }
  const tag = tool.tag ? `<span class="tool-tag">${escapeHtml(tool.tag)}</span>` : '';
  const downloadAttr = tool.download ? ` download${typeof tool.download === 'string' ? `="${escapeHtml(tool.download)}"` : ''}` : '';
  return `
    <a class="tool-card glass glass-glow" href="${escapeHtml(tool.url || '#')}"${downloadAttr} ${tool.download ? '' : 'target="_blank" rel="noopener"'}>
      <div class="tool-head">
        <h4>${escapeHtml(tool.title)}</h4>
        ${iconSvg(tool.icon || (tool.download ? 'download' : 'link'), 'link-icon')}
      </div>
      ${tool.desc ? `<p class="tool-desc">${escapeHtml(tool.desc)}</p>` : ''}
      ${tag}
    </a>`;
}

function renderToolsGrid(tools) {
  if (!tools || !tools.length) return '';
  return `<div class="tools-grid">${tools.map(renderTool).join('')}</div>`;
}

function renderSubsection(sub, idx) {
  const tools = renderToolsGrid(sub.tools);
  return `
    <div class="subsection" data-searchtext="${escapeHtml((sub.title||'') + ' ' + (sub.tools||[]).map(t=>t.title).join(' ')).toLowerCase()}">
      <div class="subsection-head" onclick="this.parentElement.classList.toggle('open'); syncMaxHeight(this.parentElement.querySelector('.subsection-body'))">
        <h3>${escapeHtml(sub.title)}</h3>
        ${iconSvg('link', 'chevron').replace('link-icon','chevron').replace(ICONS.link, '<polyline points="6 9 12 15 18 9"/>')}
      </div>
      <div class="subsection-body">
        <div class="subsection-body-inner">${tools}</div>
      </div>
    </div>`;
}

function renderSection(section, idx) {
  const tools = renderToolsGrid(section.tools);
  const subs = (section.subsections || []).map(renderSubsection).join('');
  const count = (section.tools ? section.tools.length : 0) + (section.subsections || []).reduce((a,s)=>a+(s.tools?s.tools.length:0),0);
  const searchText = [
    section.title || '',
    ...(section.tools || []).map(t => t.title),
    ...(section.subsections || []).flatMap(s => [s.title, ...(s.tools||[]).map(t=>t.title)])
  ].join(' ').toLowerCase();

  return `
    <div class="section-block glass ${idx === 0 ? 'open' : ''}" data-searchtext="${escapeHtml(searchText)}">
      <div class="section-head" onclick="toggleSection(this.parentElement)">
        <div class="section-head-left">
          ${iconSvg(section.icon || 'folder', 'section-icon')}
          <h2>${escapeHtml(section.title)}</h2>
          <span class="section-count">${count}</span>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="section-body">
        <div class="section-body-inner">
          ${tools}
          ${subs}
        </div>
      </div>
    </div>`;
}

function toggleSection(block) {
  block.classList.toggle('open');
  syncMaxHeight(block.querySelector('.section-body'));
}
function syncMaxHeight(bodyEl) {
  const block = bodyEl.closest('.section-block') || bodyEl.closest('.subsection');
  const isOpen = block.classList.contains('open');
  bodyEl.style.maxHeight = isOpen ? bodyEl.scrollHeight + 'px' : '0px';
  // propagate to parent section if inside one (subsection growth affects section height)
  const parentSectionBody = bodyEl.closest('.section-body');
  if (parentSectionBody && parentSectionBody !== bodyEl) {
    const parentBlock = parentSectionBody.closest('.section-block');
    if (parentBlock && parentBlock.classList.contains('open')) {
      parentSectionBody.style.maxHeight = parentSectionBody.scrollHeight + 'px';
    }
  }
}

function copyCode(id, btn) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.innerHTML;
    btn.innerHTML = '✓';
    setTimeout(() => btn.innerHTML = original, 1200);
  });
}

function openAllInitial() {
  document.querySelectorAll('.section-block').forEach(block => {
    const body = block.querySelector('.section-body');
    if (block.classList.contains('open')) {
      body.style.maxHeight = body.scrollHeight + 'px';
    }
  });
}

function setupSearch() {
  const input = document.getElementById('search');
  const emptyState = document.getElementById('empty-state');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let anyVisible = false;
    document.querySelectorAll('.section-block').forEach(block => {
      const matchSection = block.dataset.searchtext.includes(q);
      block.classList.toggle('hidden-by-search', q && !matchSection);
      if (q && matchSection) {
        block.classList.add('open');
      }
      if (!q && block !== document.querySelector('.section-block')) {
        // keep state as-is when search cleared
      }
      if (matchSection || !q) anyVisible = anyVisible || true;
      const body = block.querySelector('.section-body');
      if (block.classList.contains('open')) {
        body.style.maxHeight = body.scrollHeight + 'px';
      }
      block.querySelectorAll('.subsection').forEach(sub => {
        const matchSub = sub.dataset.searchtext.includes(q);
        sub.classList.toggle('hidden-by-search', q && !matchSub);
        if (q && matchSub) sub.classList.add('open');
        const subBody = sub.querySelector('.subsection-body');
        subBody.style.maxHeight = sub.classList.contains('open') ? subBody.scrollHeight + 'px' : '0px';
      });
      // re-sync section height after subsections changed
      if (block.classList.contains('open')) {
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    });
    const visibleCount = document.querySelectorAll('.section-block:not(.hidden-by-search)').length;
    emptyState.classList.toggle('show', q && visibleCount === 0);
  });
}

async function init() {
  try {
    const res = await fetch('games.yaml');
    const text = await res.text();
    const data = jsyaml.load(text);

    if (data.title) document.getElementById('page-title').textContent = data.title;
    if (data.description) document.getElementById('page-desc').textContent = data.description;

    const container = document.getElementById('sections');
    container.innerHTML = (data.sections || []).map(renderSection).join('');

    lucide.createIcons();
    openAllInitial();
    setupSearch();

    document.querySelectorAll('.glass-glow').forEach(el => {
      el.addEventListener('mousemove', e => {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--gx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--gy', (e.clientY - r.top) + 'px');
      });
      el.addEventListener('mouseleave', () => {
        el.style.setProperty('--gx', '-999px');
        el.style.setProperty('--gy', '-999px');
      });
    });
  } catch (e) {
    document.getElementById('sections').innerHTML =
      `<p style="opacity:0.6">Impossible de charger games.yaml (${e.message}). Vérifie qu'il est bien à côté d'index.html et que tu ouvres la page via un serveur local (pas en double-clic direct).</p>`;
    console.error(e);
  }
}
init();
</script>
</body>
</html>
