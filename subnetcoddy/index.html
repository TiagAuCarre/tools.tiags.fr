<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetCoddy — Network Toolkit</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --bg: #0a0a0a;
  --glass: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.10);
  --green: #00ff66;
  --green-glow: #66ff99;
  --text: #f5f2ed;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'League Spartan', sans-serif; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }
button,input,select,textarea { font-family: inherit; }
.container { max-width: 1150px; margin: auto; padding: 0 20px; position: relative; z-index: 2; }

/* ===== FOND ===== */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  z-index: 0;
}
.orb-1 {
  width: 550px;
  height: 550px;
  background: radial-gradient(circle, rgba(0,255,102,0.13), transparent 70%);
  top: -180px;
  left: -160px;
  animation: orbFloat 16s ease-in-out infinite;
}
.orb-2 {
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(0,255,102,0.09), transparent 70%);
  bottom: -140px;
  right: -120px;
  animation: orbFloat2 19s ease-in-out infinite;
}
@keyframes orbFloat {
  0%,100% { transform: translate(0,0) }
  50% { transform: translate(40px,-25px) }
}
@keyframes orbFloat2 {
  0%,100% { transform: translate(0,0) }
  50% { transform: translate(-30px,20px) }
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(20px) }
  to { opacity:1; transform:translateY(0) }
}

/* ===== GLASS ===== */
.glass {
  background: var(--glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

/* ===== TOP BAR ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 999;
  padding: 18px 20px 0;
}
.header-pill {
  max-width: 1150px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10,10,10,0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px;
  padding: 12px 24px;
}
.logo {
  font-weight: 900;
  letter-spacing: 1px;
  font-size: 1.05rem;
}
.logo span { color: var(--green); }

.free-badge {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--green-glow);
  background: rgba(0,255,102,0.1);
  border: 1px solid rgba(0,255,102,0.3);
  padding: 6px 14px;
  border-radius: 999px;
  text-transform: uppercase;
}

/* ===== HERO ===== */
.hero {
  padding: 150px 0 30px;
  text-align: center;
  animation: fadeInUp 0.7s ease both;
}
.hero h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.5px;
}
.hero h1 span { color: var(--green-glow); }
.hero p {
  opacity: 0.6;
  font-size: 0.95rem;
  margin-top: 8px;
}

/* ===== LAYOUT ===== */
.studio {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 22px;
  padding: 30px 0 80px;
  align-items: start;
  animation: fadeInUp 0.8s ease both;
}
@media (max-width: 900px) {
  .studio { grid-template-columns: 1fr; }
}

.panel {
  padding: 24px;
  border-radius: 24px;
}
.panel h2 {
  font-size: 0.85rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--green-glow);
  margin-bottom: 16px;
}

/* ===== SEARCH ===== */
#tool-search {
  width: 100%;
  padding: 10px 14px;
  margin-bottom: 14px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  outline: none;
}
#tool-search:focus {
  border-color: rgba(0,255,102,0.5);
}

/* ===== TOOL LIST ===== */
.category-title {
  color: var(--green-glow);
  font-size: 0.7rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 18px 0 8px;
}

.tool-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.tool-item {
  cursor: pointer;
  border-radius: 12px;
  padding: 10px 12px;
  border: 1px solid transparent;
  background: rgba(255,255,255,0.025);
  color: var(--text);
  opacity: 0.7;
  transition: 0.2s;
  font-size: 0.8rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
}
.tool-item:hover {
  border-color: rgba(0,255,102,0.35);
  color: var(--green-glow);
  transform: translateX(2px);
}
.tool-item.active {
  border-color: rgba(0,255,102,0.5);
  background: rgba(0,255,102,0.08);
  color: var(--green);
  opacity: 1;
}
.tool-item svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

/* ===== EDITOR ===== */
.editor-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.workspace {
  min-height: 450px;
  padding: 24px;
  border-radius: 24px;
}

.workspace h2 {
  font-size: 1.35rem;
  font-weight: 900;
  margin-bottom: 5px;
}

.workspace .description {
  opacity: 0.55;
  font-size: 0.85rem;
  margin-bottom: 22px;
}

/* ===== FIELDS ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 14px;
}

@media(max-width:650px) {
  .grid { grid-template-columns: 1fr; }
}

.field label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  opacity: 0.65;
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 600;
  outline: none;
  transition: 0.2s;
}

.field textarea {
  min-height: 140px;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: rgba(0,255,102,0.5);
  box-shadow: 0 0 0 3px rgba(0,255,102,0.05);
}

/* ===== BUTTONS ===== */
.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.82rem;
  cursor: pointer;
  transition: 0.25s;
  border: 1.5px solid rgba(0,255,102,0.4);
  color: var(--green-glow);
  background: rgba(0,255,102,0.08);
}
.btn:hover {
  background: rgba(0,255,102,0.18);
  border-color: var(--green);
  transform: translateY(-2px);
}
.btn svg {
  width: 15px;
  height: 15px;
}
.btn.primary {
  background: var(--green);
  color: #001a08;
  border-color: var(--green);
}
.btn.primary:hover {
  background: var(--green-glow);
}
.btn.ghost {
  background: rgba(255,255,255,0.05);
  border-color: rgba(255,255,255,0.15);
  color: var(--text);
  opacity: 0.8;
}
.btn.ghost:hover {
  border-color: rgba(255,255,255,0.3);
  opacity: 1;
}
.btn.danger {
  color: #ff6688;
  background: rgba(255,80,120,0.08);
  border-color: rgba(255,80,120,0.25);
}
.btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none !important;
}

/* ===== RESULT ===== */
.result {
  margin-top: 20px;
  padding: 18px;
  border-radius: 15px;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.08);
  overflow-x: auto;
}

.result-title {
  color: var(--green-glow);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 12px;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
  margin-bottom: 15px;
}

@media(max-width:750px) {
  .stat-grid { grid-template-columns: repeat(2,1fr); }
}

.stat {
  padding: 13px;
  border-radius: 12px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.07);
}
.stat small {
  display: block;
  opacity: 0.5;
  font-size: 0.7rem;
  margin-bottom: 4px;
}
.stat b {
  color: var(--green-glow);
  font-size: 1rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}
th,td {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  text-align: left;
  font-size: 0.8rem;
}
th {
  color: var(--green-glow);
  font-weight: 900;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--green-glow);
  font-family: monospace;
  font-size: 0.8rem;
}

/* ===== DHCP ===== */
.dhcp-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 570px;
  overflow-y: auto;
  padding-right: 4px;
}

.dhcp-list::-webkit-scrollbar {
  width: 6px;
}
.dhcp-list::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
}

.dhcp-row {
  display: grid;
  grid-template-columns: minmax(130px,1fr) 110px 42px;
  gap: 8px;
  align-items: center;
}

.dhcp-row input {
  width: 100%;
  padding: 10px 11px;
  border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.04);
  color: var(--text);
  outline: none;
  font-size: 0.8rem;
  font-weight: 700;
}
.dhcp-row input:focus {
  border-color: rgba(0,255,102,0.5);
}

.dhcp-number {
  text-align: center;
}

.dhcp-remove {
  width: 42px;
  height: 40px;
  justify-content: center;
  padding: 0;
}

@media(max-width:600px) {
  .dhcp-row {
    grid-template-columns: minmax(100px,1fr) 80px 40px;
  }
}

/* ===== BADGE ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--green-glow);
  background: rgba(0,255,102,0.08);
  border: 1px solid rgba(0,255,102,0.2);
}

/* ===== FOOTER ===== */
footer {
  text-align: center;
  padding: 10px 0 40px;
  opacity: 0.4;
  font-size: 0.82rem;
}
</style>
</head>

const toolMap = {};

for (const [category, list] of Object.entries(tools)) {
  for (const tool of list) {
    toolMap[tool[0]] = {

/* =========================================================
   SIDEBAR
   ========================================================= */

const toolMenu = document.getElementById("tool-menu");

function renderMenu(filter="") {

  toolMenu.innerHTML = "";

  const query = filter.toLowerCase().trim();

  for (const [category,list] of Object.entries(tools)) {

    const filtered = list.filter(tool =>
      tool[1].toLowerCase().includes(query) ||
      category.toLowerCase().includes(query)
    );

    if (!filtered.length) continue;

    const title = document.createElement("div");
    title.className = "category-title";
    title.textContent = category;
    toolMenu.appendChild(title);

    const listEl = document.createElement("div");
    listEl.className = "tool-list";

    filtered.forEach(tool => {

      const button = document.createElement("div");

      button.className = "tool-item";
      button.dataset.tool = tool[0];

      button.innerHTML = `
        <i data-lucide="${tool[2]}"></i>
        <span>${tool[1]}</span>
      `;

      button.onclick = () => openTool(tool[0]);

      listEl.appendChild(button);
    });

    toolMenu.appendChild(listEl);
  }

  lucide.createIcons();
}

document.getElementById("tool-search").addEventListener("input",e=>{
  renderMenu(e.target.value);
});

renderMenu();

/* =========================================================
   COMMON HELPERS
   ========================================================= */

function esc(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function ipToInt(ip) {

  const parts = ip.trim().split(".");

  if (
    parts.length !== 4 ||
    parts.some(x => !/^\d+$/.test(x) || Number(x) < 0 || Number(x) > 255)
  ) {
    throw new Error("Adresse IPv4 invalide.");
  }

  return (
    (((Number(parts[0]) * 256) + Number(parts[1])) * 256 + Number(parts[2])) * 256
    + Number(parts[3])
  );
}

function intToIp(n) {

  n = Number(n) >>> 0;

  return [
    (n >>> 24) & 255,
    (n >>> 16) & 255,
    (n >>> 8) & 255,
    n & 255
  ].join(".");
}

function maskFromPrefix(prefix) {

  if (prefix === 0) return 0;

  return (0xffffffff << (32-prefix)) >>> 0;
}

function parseCIDR(value) {

  const match = value.trim().match(/^(.+)\/(\d{1,2})$/);

  if (!match) {
    throw new Error("Format attendu : 192.168.1.0/24");
  }

  const ip = ipToInt(match[1]);
  const prefix = Number(match[2]);

  if (prefix < 0 || prefix > 32) {
    throw new Error("Préfixe CIDR invalide.");
  }

  const mask = maskFromPrefix(prefix);

  const network = (ip & mask) >>> 0;
  const broadcast = (network | (~mask >>> 0)) >>> 0;

  return {
    ip,
    prefix,
    mask,
    network,
    broadcast,
    total: broadcast-network+1,
    hosts:
      prefix <= 30
        ? broadcast-network-1
        : prefix === 31
          ? 2
          : 1
  };
}

function prefixToMask(prefix) {
  return intToIp(maskFromPrefix(prefix));
}

/* =========================================================
   OPEN TOOL
   ========================================================= */

const workspace = document.getElementById("workspace");

function openTool(id) {

  document.querySelectorAll(".tool-item").forEach(item=>{
    item.classList.toggle("active",item.dataset.tool===id);
  });

  if (renderers[id]) {
    renderers[id]();
  } else {
    renderGeneric(id);
  }

  lucide.createIcons();
}

/* =========================================================
   SUBNET
   ========================================================= */

function renderSubnet() {

  workspace.innerHTML = `
    <h2>Subnet Calculator</h2>
    <div class="description">
      Analyse complète d'un réseau IPv4.
    </div>

    <div class="grid">

      <div class="field">
        <label>Adresse / CIDR</label>
        <input id="subnet-input" value="192.168.1.0/24">
      </div>

    </div>

    <div class="toolbar" style="margin-top:18px">
      <button class="btn primary" onclick="calculateSubnet()">
        <i data-lucide="calculator"></i>
        Calculer
      </button>
    </div>

    <div id="subnet-result"></div>
  `;

  lucide.createIcons();
}

function calculateSubnet() {

  try {

    const x = parseCIDR(
      document.getElementById("subnet-input").value
    );

    document.getElementById("subnet-result").innerHTML = `

      <div class="result">

        <div class="result-title">Résultat</div>

        <div class="stat-grid">

          <div class="stat">
            <small>Network ID</small>
            <b>${intToIp(x.network)}</b>
          </div>

          <div class="stat">
            <small>Broadcast</small>
            <b>${intToIp(x.broadcast)}</b>
          </div>

          <div class="stat">
            <small>Masque</small>
            <b>${prefixToMask(x.prefix)}</b>
          </div>

          <div class="stat">
            <small>Hôtes</small>
            <b>${x.hosts}</b>
          </div>

        </div>

        <table>

          <tr>
            <th>Propriété</th>
            <th>Valeur</th>
          </tr>

          <tr>
            <td>CIDR</td>
            <td>/${x.prefix}</td>
          </tr>

          <tr>
            <td>Premier hôte</td>
            <td>${intToIp(x.prefix >= 31 ? x.network : x.network+1)}</td>
          </tr>

          <tr>
            <td>Dernier hôte</td>
            <td>${intToIp(x.prefix >= 31 ? x.broadcast : x.broadcast-1)}</td>
          </tr>

          <tr>
            <td>Wildcard</td>
            <td>${intToIp((~x.mask)>>>0)}</td>
          </tr>

          <tr>
            <td>Adresses totales</td>
            <td>${x.total}</td>
          </tr>

        </table>

      </div>
    `;

function renderSplit() {

  workspace.innerHTML = `
    <h2>CIDR Splitter</h2>
    <div class="description">
      Découpe un réseau en sous-réseaux de taille identique.
    </div>

    <div class="grid">

      <div class="field">
        <label>Réseau</label>
        <input id="split-network" value="192.168.1.0/24">
      </div>

      <div class="field">
        <label>Nouveau préfixe</label>
        <input id="split-prefix" type="number" min="1" max="32" value="26">
      </div>

    </div>

    <div class="toolbar" style="margin-top:18px">

      <button class="btn primary" onclick="calculateSplit()">
        <i data-lucide="git-branch"></i>
        Découper
      </button>

    </div>

    <div id="split-result"></div>
  `;

  lucide.createIcons();
}

function calculateSplit() {

  try {

    const net = parseCIDR(
      document.getElementById("split-network").value
    );

    const prefix = Number(
      document.getElementById("split-prefix").value
    );

    if (prefix < net.prefix) {
      throw new Error("Le nouveau préfixe doit être supérieur ou égal.");
    }

    const count = 2 ** (prefix-net.prefix);

    if (count > 4096) {
      throw new Error("Trop de sous-réseaux à afficher.");
    }

    const size = 2 ** (32-prefix);

    let rows = "";

    for (let i=0;i<count;i++) {

      const network = net.network + i*size;
      const broadcast = network+size-1;

      rows += `
        <tr>
          <td>${i+1}</td>
          <td>${intToIp(network)}/${prefix}</td>
          <td>${intToIp(network+1)}</td>
          <td>${intToIp(broadcast-1)}</td>
          <td>${intToIp(broadcast)}</td>
        </tr>
      `;
    }

    document.getElementById("split-result").innerHTML = `
      <div class="result">

        <table>

          <tr>
            <th>#</th>
            <th>Réseau</th>
            <th>Premier</th>
            <th>Dernier</th>
            <th>Broadcast</th>
          </tr>

          ${rows}

        </table>

      </div>
    `;

  } catch(e) {

    document.getElementById("split-result").innerHTML =
      `<div class="result" style="color:#ff6688">${esc(e.message)}</div>`;
  }
}

    count:x[1]
  }));

function generateDHCP() {

  try {

    const network = parseCIDR(
      document.getElementById("dhcp-network").value
    );

    if(network.prefix >= 31) {
      throw new Error("Le réseau est trop petit pour un pool DHCP classique.");
    }

    const gatewayText =
      document.getElementById("dhcp-gateway").value.trim();

    const gateway = gatewayText
      ? ipToInt(gatewayText)
      : network.network+1;

    let startText =
      document.getElementById("dhcp-start").value.trim();

    let endText =
      document.getElementById("dhcp-end").value.trim();

    const start = startText
      ? ipToInt(startText)
      : network.network+2;

    const end = endText
      ? ipToInt(endText)
      : network.broadcast-1;

    if(
      start < network.network+1 ||
      end > network.broadcast-1 ||
      start > end
    ) {
      throw new Error("Le pool DHCP doit rester dans la plage du réseau.");
    }

    if(
      gateway < network.network+1 ||
      gateway > network.broadcast-1
    ) {
      throw new Error("La passerelle n'est pas dans le réseau.");
    }

    if(gateway >= start && gateway <= end) {
      throw new Error("La passerelle doit être exclue du pool DHCP.");
    }

    const available = end-start+1;

    const requested = dhcpCategories.reduce(
      (sum,category)=>sum+Math.max(0,Number(category.count)||0),
      0
    );

    if(requested > available) {

      throw new Error(
        `Impossible d'allouer ${requested} adresses : seulement ${available} sont disponibles.`
      );

    }

    let cursor=start;

    let rows="";

    dhcpCategories.forEach(category=>{

      const count=Math.max(
        0,
        Number(category.count)||0
      );

      if(count===0) {

        rows += `
          <tr>
            <td>${esc(category.name)}</td>
            <td>—</td>
            <td>—</td>
            <td>0</td>
            <td>0%</td>
          </tr>
        `;

        return;
      }

      const allocationStart=cursor;
      const allocationEnd=cursor+count-1;

      cursor=allocationEnd+1;

      rows += `
        <tr>

          <td>${esc(category.name)}</td>

          <td>${intToIp(allocationStart)}</td>

          <td>${intToIp(allocationEnd)}</td>

          <td>${count}</td>

          <td>${((count/available)*100).toFixed(2)}%</td>

        </tr>
      `;

    });

    const remaining=available-requested;

    document.getElementById("dhcp-result").innerHTML = `

      <div class="result">

        <div class="result-title">
          Pool DHCP généré
        </div>

        <div class="stat-grid">

          <div class="stat">
            <small>Pool</small>
            <b>${intToIp(start)} → ${intToIp(end)}</b>
          </div>

          <div class="stat">
            <small>Disponibles</small>
            <b>${available}</b>
          </div>

          <div class="stat">
            <small>Attribuées</small>
            <b>${requested}</b>
          </div>

          <div class="stat">
            <small>Restantes</small>
            <b>${remaining}</b>
          </div>

        </div>

        <table>

          <tr>
            <th>Catégorie</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Entités</th>
            <th>Part</th>
          </tr>

          ${rows}

        </table>

        <div style="height:18px"></div>

        <table>

          <tr>
            <th>Paramètre</th>
            <th>Valeur</th>
          </tr>

          <tr>
            <td>Réseau</td>
            <td>${intToIp(network.network)}/${network.prefix}</td>
          </tr>

          <tr>
            <td>Masque</td>
            <td>${prefixToMask(network.prefix)}</td>
          </tr>

          <tr>
            <td>Passerelle</td>
            <td>${intToIp(gateway)}</td>
          </tr>

          <tr>
            <td>Broadcast</td>
            <td>${intToIp(network.broadcast)}</td>
          </tr>

          <tr>
            <td>Adresses libres</td>
            <td>${remaining}</td>
          </tr>

        </table>

      </div>
    `;

  } catch(e) {

    document.getElementById("dhcp-result").innerHTML = `
      <div class="result">
        <span style="color:#ff6688;font-weight:800">
          ${esc(e.message)}
        </span>
      </div>
    `;
  }
}

  `;

function analyzeMAC() {

  try {

    const input =
      document.getElementById("mac-input").value;

    const hex =
      input.replace(/[^0-9a-fA-F]/g,"").toUpperCase();

    if(!/^[0-9A-F]{12}$/.test(hex)) {
      throw new Error("Adresse MAC invalide.");
    }

    const first=parseInt(hex.slice(0,2),16);

    const multicast=Boolean(first&1);
    const local=Boolean(first&2);

    const colon=hex.match(/../g).join(":");
    const dash=hex.match(/../g).join("-");
    const cisco=
      hex.slice(0,4)+"."+hex.slice(4,8)+"."+hex.slice(8,12);

    const binary=
      hex.match(/../g)
        .map(x=>parseInt(x,16).toString(2).padStart(8,"0"))
        .join(" ");

    document.getElementById("mac-result").innerHTML = `

      <div class="result">

        <table>

          <tr>
            <th>Propriété</th>
            <th>Valeur</th>
          </tr>

          <tr>
            <td>Standard</td>
            <td>${colon}</td>
          </tr>

          <tr>
            <td>Format Cisco</td>
            <td>${cisco}</td>
          </tr>

          <tr>
            <td>Type</td>
            <td>${multicast ? "Multicast" : "Unicast"}</td>
          </tr>

          <tr>
            <td>Administration</td>
            <td>${local ? "Locale" : "Universelle"}</td>
          </tr>

          <tr>
            <td>Binaire</td>
            <td>${binary}</td>
          </tr>

        </table>

      </div>
    `;

  } catch(e) {

    document.getElementById("mac-result").innerHTML =
      `<div class="result" style="color:#ff6688">${esc(e.message)}</div>`;
  }
}

function generateCommand(template) {

  let command=template;

  document.querySelectorAll('[id^="command-"]').forEach(input=>{

    const id=input.id.replace("command-","");

    command=command.replaceAll(
      `{${id}}`,
      input.value
    );

  });

  document.getElementById("command-result").innerHTML = `

    <div class="result">

      <div class="result-title">
        Commande
      </div>

      <pre>${esc(command)}</pre>

    </div>

  `;
}
